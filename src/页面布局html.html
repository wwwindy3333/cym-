#给不同的内容分配不一样的布局和格式：给不同的东西“起名字”然后分别写样式
<head>
<style>
    .red-text {
        color: red;
        font-weight: bold;
    }
    
    .blue-text {
        color: blue;
        font-size: 20px;
    }
    
    .center {
        text-align: center;
    }
</style>
</head>
<body>
    <p class="red-text center">这段文字是红色、加粗、居中</p >
    <p class="blue-text">这段文字是蓝色、大号</p >
    <p class="red-text">这段文字也是红色加粗，但不居中</p >
</body>
